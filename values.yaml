            file: tls.key
            mountPath: /certs/ingress.key

  # -------------- #
  #    UPDATES     #
  # -------------- #

  kcs-updates:
    enabled: "{{ $.Values.default.updates.enabled }}"

    appType: deployment
    replicaCount: 1
    recreate: true
    securityContext:
      kubernetes:
        fsGroup: 2222
        fsGroupChangePolicy: Always
        runAsUser: 2222
        runAsGroup: 2222
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    container:
      kcs-updates:
        image: REGISTRY_ROOT/updates
        imageTag: v2.4
        imagePullPolicy: Always
        securityContext:
          kubernetes:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        resources:
          requests:
            cpu: "80m"
            memory: "64Mi"
          limits:
            cpu: "1"
            memory: "1Gi"

        service:
          kcs-updates:
            cert: true
            port: 8080
            containerPort: 8080
            protocol: TCP
            ingress:
              - name: kcs
                path: "/kuu"
            allowedServiceTraffic:
              - kcs-ih
              - kcs-scanner
              - kcs-licenses
              - kcs-node-agent

        envFromExistConfigMap:
          TLS_INTERNAL: infraconfig
          LOG_LEVEL: infraconfig
          HTTP_MODE: infraconfig

        envFromResourceFieldRef:
          GOMAXPROCS:
            resource: limits.cpu
            divisor: 1
          GOMEMLIMIT:
            resource: limits.memory
            divisor: 1

        dir:
          - name: tmp
            mountPath: /tmp
            readOnly: false
            emptyDir: {}
          - name: nginx
            mountPath: /var/nginx
            readOnly: false
            emptyDir: {}

        fileFromSecret:
          ## Declaration of possible file mounting.
          ##   Editing is not required

          ## Internal CA
          - secret: cert-ca
            file: tls.crt
            mountPath: /etc/ssl/certs/ca.crt

          ## UPDATES internal server certificate
          - secret: cert-kcs-updates
            file: tls.crt
            mountPath: /certs/service.crt
          - secret: cert-kcs-updates
            file: tls.key
            mountPath: /certs/service.key

  # -------------- #
  #  EVENT-BROKER  #
  # -------------- #

  kcs-event-broker:
    enabled: true

    appType: deployment
    replicaCount: 1
    recreate: true
    securityContext:
      kubernetes:
        runAsUser: 2222
        runAsGroup: 2222
        fsGroup: 2222
        fsGroupChangePolicy: Always
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    initContainer:
      eb-to-clhs-check:
        image: REGISTRY_ROOT/initer
        imageTag: v2.4.0
        command:
          - "sh"
          - "-c"
          - "/opt/scripts/clickhouse.sh"
        securityContext:
          kubernetes:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        resources:
          requests:
            memory: "10Mi"
            cpu: "10m"
          limits:
            memory: "200Mi"
            cpu: "200m"
        envFromExistConfigMap:
          TLS_INTERNAL: infraconfig
          CLICKHOUSE_HOST: infraconfig
          CLICKHOUSE_PORT: infraconfig
          CLICKHOUSE_EXT: infraconfig
          VAULT_PATH: infraconfig
        envFromExistSecret:
          CLICKHOUSE_READ_PASSWORD: infracreds
        fileFromSecret:
          - secret: cert-ca
            file: tls.crt
            mountPath: /etc/ssl/certs/ca.crt
          - secret: cert-kcsuser-read
            file: tls.crt
            mountPath: /etc/ssl/certs/kcsuser-read.crt
          - secret: cert-kcsuser-read
            file: tls.key
            mountPath: /etc/ssl/certs/kcsuser-read.key

    container:
      kcs-event-broker:
        image: REGISTRY_ROOT/services/event-broker
        imageTag: v2.4.0
        securityContext:
          kubernetes:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "3Gi"
            cpu: "3"

        service:
          kcs-eb:
            cert: true
            port: 8881
            containerPort: 8881
            protocol: TCP
            allowedServiceTraffic:
              - kcs-middleware
              - kcs-ab

          kcs-eb-ingress:
            port: 8880
            containerPort: 8880
            protocol: TCP
            ingress:
              - name: kcs
                path: "/clickhouse"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10

        envFromExistConfigMap:
          TLS_INTERNAL: infraconfig
          TLS_INGRESS: infraconfig
          CLUSTER_DNS_ZONE: infraconfig
          VAULT_PATH: infraconfig
          AGENT_BROKER_HOST: infraconfig
          AGENT_BROKER_PORT: infraconfig
          MIDDLEWARE_HOST: infraconfig
          MIDDLEWARE_PORT: infraconfig
          CLICKHOUSE_PROTOCOL: infraconfig
          CLICKHOUSE_HOST: infraconfig
          CLICKHOUSE_PORT: infraconfig
          CLICKHOUSE_SINGLE_STORAGE: infraconfig
          MAIN_STORAGE_TIME: infraconfig
          INCIDENT_STORAGE_TIME: infraconfig
          COLLECTION_INTERVAL: infraconfig
          CLICKHOUSE_EXT: infraconfig
          EXT_CLICKHOUSE_PROTOCOL: infraconfig
          EXT_CLICKHOUSE_HOST: infraconfig
          EXT_CLICKHOUSE_PORT: infraconfig
          EXT_CLICKHOUSE_DB_NAME: infraconfig
          EXT_CLICKHOUSE_COLD_STORAGE_NAME: infraconfig
          EXT_CLICKHOUSE_STORAGE_POLICY_NAME: infraconfig
          EXT_CLICKHOUSE_SSL_AUTH: infraconfig
          EXT_CLICKHOUSE_ROOT_CA_PATH: infraconfig
          LOG_LEVEL: infraconfig
          HTTP_MODE: infraconfig

        envFromExistSecret:
          EXT_CLICKHOUSE_WRITE_USER: infracreds
          EXT_CLICKHOUSE_READ_USER: infracreds
          CLICKHOUSE_READ_PASSWORD: infracreds
          CLICKHOUSE_WRITE_PASSWORD: infracreds

        envFromfieldRef:
          POD_NAMESPACE: metadata.namespace
          POD_NAME: metadata.name

        envFromResourceFieldRef:
          GOMAXPROCS:
            resource: limits.cpu
            divisor: 1
          GOMEMLIMIT:
            resource: limits.memory
            divisor: 1

        dir:
          - name: tmp
            mountPath: /tmp
            readOnly: false
            emptyDir: {}
          - name: nginx
            mountPath: /var/nginx
            readOnly: false
            emptyDir: {}

        fileFromSecret:
          ## Declaration of possible file mounting.
          ##   Editing is not required

          ## Internal CA
          - secret: cert-ca
            file: tls.crt
            mountPath: /etc/ssl/certs/ca.crt

          ## EventBroker internal server certificate
          - secret: cert-kcs-eb
            file: tls.crt
            mountPath: /etc/ssl/certs/service.crt
          - secret: cert-kcs-eb
            file: tls.key
            mountPath: /etc/ssl/certs/service.key

          ## ClickHouse CA certificate
          - secret: cert-kcs-clickhouse-ca
            file: tls.crt
            mountPath: /etc/ssl/certs/kcs-clickhouse-ca.crt

          ## ClickHouse client certificates
          - secret: cert-kcsuser-write
            file: tls.crt
            mountPath: /etc/ssl/certs/kcsuser-write.crt
          - secret: cert-kcsuser-write
            file: tls.key
            mountPath: /etc/ssl/certs/kcsuser-write.key
          - secret: cert-kcsuser-read
            file: tls.crt
            mountPath: /etc/ssl/certs/kcsuser-read.crt
          - secret: cert-kcsuser-read
            file: tls.key
            mountPath: /etc/ssl/certs/kcsuser-read.key

          ## EventBroker external (ingress) certificate
          - secret: cert-ingress
            file: tls.crt
            mountPath: /etc/ssl/certs/cert.crt
          - secret: cert-ingress
            file: tls.key
            mountPath: /etc/ssl/certs/cert.key

  # -------------- #
  #   MEMCACHED    #
  # -------------- #

  kcs-memcached:
    enabled: true
    appType: statefulSet
    podManagementPolicy: OrderedReady
    replicaCount: 1
    strategy: RollingUpdate
    securityContext:
      kubernetes:
        runAsUser: 2222
        runAsGroup: 2222
        fsGroup: 2222
        fsGroupChangePolicy: Always
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    container:
      kcs-memcached:
        imagePullPolicy: IfNotPresent
        image: REGISTRY_ROOT/external/memcached
        imageTag: 1.6.39-2
        command:
          - "docker-entrypoint.sh"
        args:
          - "memcached"

        service:
          kcs-memcached:
            cert: true
            port: 11211
            containerPort: 11211
            protocol: TCP
            allowedServiceTraffic:
              - kcs-middleware
              - kcs-ab

        securityContext:
          kubernetes:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "2"
            memory: "2Gi"

        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
          exec:
            command:
              - pgrep
              - memcached

        envFromExistConfigMap:
          TLS_INTERNAL: infraconfig
          MEMCACHED_PORT_NUMBER: infraconfig
          MEMCACHED_MAX_CONNECTIONS: infraconfig
          MEMCACHED_EXTRA_FLAGS: infraconfig
          MEMCACHED_MAX_ITEM_SIZE: infraconfig
          VAULT_PATH: infraconfig

        envFromExistSecret:
          MCHD_USER: infracreds
          MCHD_PASS: infracreds

        envFromResourceFieldRef:
          MEMCACHED_THREADS:
            resource: limits.cpu
            divisor: 1
          MEMCACHED_CACHE_SIZE:
            resource: limits.memory
            divisor: 1Mi
        envFromfieldRef:
          POD_NAME: metadata.name

        dir:
          - name: tmp
            mountPath: /tmp
            readOnly: false
            emptyDir: {}
          - name: setup
            mountPath: /var/opt/setup
            readOnly: false
            emptyDir: {}

        fileFromSecret:
          ## Declaration of possible file mounting.
          ##   Editing is not required

          ## Internal CA
          - secret: cert-ca
            file: tls.crt
            mountPath: /var/opt/memcached/certs/client/ca.crt

          ## Memcached internal server certificate
          - secret: cert-kcs-memcached
            file: tls.crt
            mountPath: /var/opt/memcached/certs/client/kcs-memcached.crt
          - secret: cert-kcs-memcached
            file: tls.key
            mountPath: /var/opt/memcached/certs/client/kcs-memcached.key

  # -------------- #
  #   POSTGRESQL   #
  # -------------- #

  kcs-postgresql:
    enabled: '{{ not (index .Values.default "kcs-postgresql").external }}'
    appType: statefulSet
    podManagementPolicy: OrderedReady
    replicaCount: 1
    strategy: RollingUpdate
    securityContext:
      kubernetes:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault

    container:
      kcs-postgresql:
        image: REGISTRY_ROOT/external/postgresql
        imageTag: 18.2.0

        securityContext:
          kubernetes:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true

        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "8"
            memory: "16Gi"

        service:
          kcs-postgresql:
            cert: true
            port: '{{- $.Values.configmap.infraconfig.envs.POSTGRES_PORT }}'
            containerPort: '{{- $.Values.configmap.infraconfig.envs.POSTGRES_PORT }}'
            protocol: TCP
            allowedServiceTraffic:
              - kcs-middleware
              - kcs-ab

        livenessProbe:
          exec:
            command:
              - "/bin/sh"
              - "-c"
              - "/maintenance_scripts/ready.sh"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
              - "/bin/sh"
              - "-c"
              - "/maintenance_scripts/live.sh"
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        env:
          POSTGRES_HOST_AUTH_METHOD: md5
          POSTGRESQL_TLS_PREFER_SERVER_CIPHERS: yes
          POSTGRESQL_TLS_CERT_FILE: /var/lib/postgresql/certs/service.crt
          POSTGRESQL_TLS_KEY_FILE: /var/lib/postgresql/certs/service.key
          POSTGRESQL_TLS_CA_FILE: /var/lib/postgresql/certs/ca.crt

        envFromExistConfigMap:
          TLS_INTERNAL: infraconfig
          POSTGRES_VERIFY_LEVEL: infraconfig
          POSTGRES_DB_NAME: infraconfig
          POSTGRESQL_SHARED_PRELOAD_LIBRARIES: infraconfig
          POSTGRESQL_MAX_CONNECTIONS: infraconfig
          POSTGRESQL_LOG_HOSTNAME: infraconfig
          POSTGRESQL_LOG_CONNECTIONS: infraconfig
          POSTGRESQL_LOG_DISCONNECTIONS: infraconfig
          POSTGRESQL_PGAUDIT_LOG_CATALOG: infraconfig
          POSTGRESQL_CLIENT_MIN_MESSAGES: infraconfig
          POSTGRESQL_EXTRA_FLAGS: infraconfig

        envFromExistSecret:
          POSTGRES_USER: infracreds
          POSTGRES_PASSWORD: infracreds

        persistent: '{{ (index .Values.default "kcs-postgresql").persistent }}'
        storage:
          pvc-pg:
            mountPath: /var/lib/postgresql
            accessModes: "ReadWriteOnce"

        fileFromSecret:
        ## Declaration of possible file mounting.
        ##   Editing is not required
        ## Internal CA
        - secret: cert-ca
          file: tls.crt
          mountPath: /var/lib/postgresql/certs/ca.crt
          mode: "0644"
        ## PostgreSQL internal server certificate
        - secret: cert-kcs-postgresql
          file: tls.crt
          mountPath: /var/lib/postgresql/certs/service.crt
          mode: "0600"
        - secret: cert-kcs-postgresql
          file: tls.key
          mountPath: /var/lib/postgresql/certs/service.key
          mode: "0600"
        ## pguser certificates
        - secret: cert-pguser
          file: tls.crt
          mountPath: /var/lib/postgresql/certs/pguser.crt
          mode: "0600"
        - secret: cert-pguser
          file: tls.key
          mountPath: /var/lib/postgresql/certs/pguser.key
          mode: "0600"

        dir:
        - name: var-run
          mountPath: /var/run
          readOnly: false
          emptyDir: {}
        - name: dshm
          mountPath: /dev/shm
          readOnly: false
          emptyDir:
            medium: Memory
        - name: tmp
          mountPath: /tmp
          readOnly: false
          emptyDir: {}

  # -------------- #
  #   CLICKHOUSE   #
  # -------------- #

  kcs-clickhouse:
    enabled: '{{ not (index .Values.default "kcs-clickhouse").external }}'
    appType: statefulSet
    podManagementPolicy: OrderedReady
    replicaCount: 1
    strategy: RollingUpdate
    securityContext:
      kubernetes:
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
        runAsNonRoot: true
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault

    container:
      kcs-clickhouse:
        image: REGISTRY_ROOT/services/clickhouse
        imageTag: '{{- if $.Values.configmap.infraconfig.envs.TLS_INTERNAL }}v2.4.0{{- else }}v2.4.0-without-ssl{{- end }}'
        command:
          - "/bin/bash"
          - "-c"
        args:
          - "exec /entrypoint.sh"

        securityContext:
          kubernetes:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CAP_SYS_NICE
                - IPC_LOCK
                - NET_ADMIN
                - SYS_NICE

        resources:
          requests:
            cpu: 200m
            memory: 1Gi

        service:
          kcs-clickhouse:
            cert: true
            port: '{{- if $.Values.configmap.infraconfig.envs.TLS_INTERNAL }}8443{{- else }}8123{{- end }}'
            containerPort: '{{- if $.Values.configmap.infraconfig.envs.TLS_INTERNAL }}8443{{- else }}8123{{- end }}'
            protocol: TCP
            allowedServiceTraffic:
              - kcs-event-broker

        livenessProbe:
          exec:
            command:
              - /bin/bash
              - /healthcheck.sh
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
              - /bin/bash
              - /healthcheck.sh
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        envFromExistConfigMap:
          TLS_INTERNAL: infraconfig
          MIDDLEWARE_HOST: infraconfig
          MIDDLEWARE_PORT: infraconfig
          CLICKHOUSE_PORT: infraconfig

        envFromExistSecret:
          CLICKHOUSE_ADMIN_PASSWORD: infracreds
          CLICKHOUSE_WRITE_PASSWORD: infracreds
          CLICKHOUSE_READ_PASSWORD: infracreds
        envFromfieldRef:
          POD_NAME: metadata.name

        env:
          CLICKHOUSE_LOG_LEVEL: information
          CLICKHOUSE_RUN_AS_ROOT: 0
          CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"

        persistent: '{{ (index .Values.default "kcs-clickhouse").persistent }}'
        storage:
          pvc-clickhouse-cold:
            mountPath: /data/clickhouse/cold
            accessModes: "ReadWriteOnce"
          pvc-clickhouse-hot:
            enabled: "{{ not ($.Values.configmap.infraconfig.envs.CLICKHOUSE_SINGLE_STORAGE) }}"
            mountPath: /data/clickhouse/hot
            accessModes: "ReadWriteOnce"

        fileFromSecret:
          ## Declaration of possible file mounting.
          ##   Editing is not required

          ## Internal CA
          - secret: cert-ca
            file: tls.crt
            mountPath: /etc/clickhouse-server/certs/ca.crt

          ## Clickhouse internal server certificate
          - secret: cert-kcs-clickhouse
            file: tls.crt
            mountPath: /etc/clickhouse-server/certs/cert.crt
          - secret: cert-kcs-clickhouse
            file: tls.key
            mountPath: /etc/clickhouse-server/certs/cert.key

  # -------------- #
  #       S3       #
  # -------------- #

  kcs-s3:
    enabled: '{{ and (index .Values.default "kcs-s3").enabled (not (default false (index .Values.default "kcs-s3").external)) }}'
    appType: statefulSet
    podManagementPolicy: OrderedReady
    replicaCount: 1
    strategy: RollingUpdate
    securityContext:
      kubernetes:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    container:
      kcs-s3:
        imagePullPolicy: IfNotPresent
        image: REGISTRY_ROOT/external/minio
        imageTag: 2026.02.17
        command:
          - "/bin/bash"
          - "-c"
        args:
          - "/usr/bin/docker-entrypoint.sh server /data"

        securityContext:
          kubernetes:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            cpu: "500m"
            memory: "512Mi"

        service:
          kcs-s3:
            cert: true
            port: 9000
            containerPort: 9000
            protocol: TCP
            allowedServiceTraffic:
              - kcs-middleware

        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9001
            scheme: "{{ if $.Values.configmap.infraconfig.envs.TLS_INTERNAL }}HTTPS{{ else }}HTTP{{ end }}"
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /minio/health/cluster
            port: 9000
            scheme: "{{ if $.Values.configmap.infraconfig.envs.TLS_INTERNAL }}HTTPS{{ else }}HTTP{{ end }}"
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5

        env:
          MINIO_CERTS_DIR: /certs

        envFromExistConfigMap:
          MINIO_PORT: infraconfig
          TLS_INTERNAL: infraconfig

        envFromExistSecret:
          MINIO_ROOT_USER: infracreds
          MINIO_ROOT_PASSWORD: infracreds

        persistent: true
        storage:
          pvc-minio:
            mountPath: /data
            accessModes: "ReadWriteOnce"

        fileFromSecret:
          ## Declaration of possible file mounting.
          ##   Editing is not required

          ## Internal CA
          - secret: cert-ca
            file: tls.crt
            mountPath: /etc/ssl/certs/ca.crt
          - secret: cert-ca
            file: tls.key
            mountPath: /etc/ssl/certs/ca.key

          ## S3 internal server certificate
          - secret: cert-kcs-s3
            file: tls.crt
            mountPath: /certs/public.crt
          - secret: cert-kcs-s3
            file: tls.key
            mountPath: /certs/private.key